<style>
:root { --fg:#1f2933; --muted:#66788a; --line:#e3e8ee; --accent:#0f766e; }
* { box-sizing:border-box; }
body { margin:0; padding:16px; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;

.card a { color:var(--accent); text-decoration:none; word-break:break-all; }

        background:#eef6f5; color:var(--accent); margin-right:6px; }

.nav a { margin-right:12px; color:var(--accent); text-decoration:none; }
