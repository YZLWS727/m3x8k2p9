<h1>Luma全球活动简报</h1>
<div class="meta">第 None 期 · None 至 None · 共 None 条</div>
<div class="floatnav"><button onclick="jump(-10)" title="向上跳 10 条">↑</button><button onclick="jump(10)" title="向下跳 10 条">↓</button></div><footer>个人自动化流水线生成 · 内容来自公开渠道 · 未收录于搜索引擎</footer></div>
<script>
function cards(){ return Array.prototype.slice.call(document.querySelectorAll('.card[id^="item-"]')); }
function jump(delta){
  const list = cards();
  if (!list.length) return;
  let current = 0;
  for (let i = 0; i < list.length; i++) { if (list[i].getBoundingClientRect().top <= 90) current = i; }
  const target = Math.min(Math.max(current + delta, 0), list.length - 1);
  list[target].scrollIntoView({behavior:'smooth', block:'start'});
}
function fallbackCopy(text){
  const area = document.createElement('textarea');
  area.value = text; area.style.position = 'fixed'; area.style.opacity = '0';
  document.body.appendChild(area); area.select();
  try { document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(area);
}
function shareCard(btn){
  const card = btn.closest('.card');
  if (!card) return;
  const lines = [];
  const title = card.querySelector('h3');
  if (title) lines.push(title.innerText.trim());
  card.querySelectorAll('.tags .tag').forEach(function(tag){ lines.push(tag.innerText.trim()); });
  card.querySelectorAll('p').forEach(function(p){ lines.push(p.innerText.trim()); });
  card.querySelectorAll('.ev').forEach(function(ev){ lines.push(ev.innerText.trim()); });
  const link = card.querySelector('a[href^="http"]');
  if (link) lines.push('原文：' + link.href);
  const text = lines.filter(function(x){ return x; }).join('\n');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function(){ done(btn); }, function(){ fallbackCopy(text); done(btn); });
  } else { fallbackCopy(text); done(btn); }
}
function done(btn){
  const old = btn.innerText;
  btn.innerText = '✓ 已复制，可直接转发';
  setTimeout(function(){ btn.innerText = old; }, 2200);
}
</script>
